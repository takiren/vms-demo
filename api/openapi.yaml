openapi: 3.0.3
info:
  title: vms-demo API
  version: 0.1.0
  description: |
    セルフホストの小規模 VMS の API。設計は docs/design.md を参照。
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api
# 既定で認証を要求する（docs/design.md の「認可」）。認証の要らない操作だけ `security: []` で外す。
# 認証が要る操作には、必要な最低ロールを `x-min-role`（admin / viewer）で必ず書く。
# viewer はログインしていれば誰でもよい。書き忘れると API が起動しない。
security:
  - cookieAuth: []
tags:
  - name: system
    description: 稼働状態など
  - name: auth
    description: ログイン、ログアウト、自分のアカウント
  - name: users
    description: ユーザー管理（admin）
  - name: cameras
    description: カメラ管理（一覧は viewer、それ以外は admin）
  - name: recordings
    description: 録画の再生（HLS VOD）とタイムライン
  - name: internal
    description: |
      MediaMTX から API への呼び出し（/api/internal/*）。Caddy が外から遮断している。
      CSRF とクッキー認証の対象外で、操作ごとに独自の認証を持つ。
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: API プロセスの死活確認
      description: |
        プロセスが応答できるかだけを返す（liveness）。DB などの依存先は確認しない。
      tags: [system]
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: ログイン
      description: |
        ユーザー名とパスワードを検証し、新しいセッションを発行して Cookie に入れる。
        ユーザー名が存在しない場合も、パスワードが違う場合と同じ 401 を返す。
        失敗が続くと 429 を返す（ユーザー名ごと、接続元 IP ごと）。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログインした。セッション Cookie を設定する
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          description: 失敗が多すぎる。Retry-After 秒後まで受け付けない
          headers:
            Retry-After:
              description: 再試行できるまでの秒数
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: ログアウト
      description: |
        送られてきたセッションを消し、Cookie を消す。ログインしていなくても 204 を返す。
      tags: [auth]
      security: []
      responses:
        "204":
          description: ログアウトした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: ログイン中のユーザー
      tags: [auth]
      x-min-role: viewer
      responses:
        "200":
          description: ログイン中のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changeOwnPassword
      summary: 自分のパスワードを変える
      description: |
        現在のパスワードが必要。変更すると、自分のセッションをすべて消し、新しいセッションを発行する。
        現在のパスワードが違う場合は 400。失敗が続くと 429。
      tags: [auth]
      x-min-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 変更した。新しいセッション Cookie を設定する
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          description: 失敗が多すぎる。Retry-After 秒後まで受け付けない
          headers:
            Retry-After:
              description: 再試行できるまでの秒数
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: ユーザーの一覧
      tags: [users]
      x-min-role: admin
      responses:
        "200":
          description: ユーザー名の順（大文字小文字を区別しない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: ユーザーを作る
      description: ユーザー名が（大文字小文字を区別せずに）既にあれば 409。
      tags: [users]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      summary: ユーザーを取得する
      tags: [users]
      x-min-role: admin
      responses:
        "200":
          description: ユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: ユーザーのロールやパスワードを変える
      description: |
        ロールかパスワードを変えると、そのユーザーのセッションをすべて消す。
        最後の admin を降格しようとすると 409。
      tags: [users]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 変更後のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: ユーザーを削除する
      description: 自分自身と、最後の admin は削除できない（409）。
      tags: [users]
      x-min-role: admin
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Error"
  /cameras:
    get:
      operationId: listCameras
      summary: カメラの一覧
      description: |
        ライブ表示に使う最小限の項目だけを返す（URL などの設定は返さない）。
        設定は admin が `GET /cameras/{id}` で取得する。
      tags: [cameras]
      x-min-role: viewer
      responses:
        "200":
          description: 名前の順
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSummaryList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCamera
      summary: カメラを登録する
      description: |
        URL に認証情報（`user:password@`）を入れると 400。認証情報は `credentials` で渡す（暗号化して保存し、返さない）。
        名前が既にあれば 409。登録すると MediaMTX に path を反映する。
      tags: [cameras]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraCreate"
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/CameraID"
    get:
      operationId: getCamera
      summary: カメラの設定を取得する
      description: 認証情報は返さない（`has_credentials` だけ）。
      tags: [cameras]
      x-min-role: admin
      responses:
        "200":
          description: カメラ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCamera
      summary: カメラの設定を変える
      description: |
        指定した項目だけを変える。認証情報は、`credentials` で置き換えるか `remove_credentials: true` で消す。
        どちらもなければ今のものを残す。sub の URL は `remove_sub_url: true` で消す。
      tags: [cameras]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraUpdate"
      responses:
        "200":
          description: 変更後のカメラ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCamera
      summary: カメラを削除する
      description: |
        録画が残っているカメラは削除できない（409）。録画を止めるだけなら `enabled: false` にする。
      tags: [cameras]
      x-min-role: admin
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Error"
  /cameras/{id}/playlist.m3u8:
    parameters:
      - $ref: "#/components/parameters/CameraID"
    get:
      operationId: getCameraPlaylist
      summary: 録画の HLS VOD プレイリスト
      description: |
        `[from, to)` と重なる録画を、セグメント単位（切らずに丸ごと）で並べた HLS（fMP4）の VOD プレイリスト。
        設計は docs/design.md の「録画再生の詳細」。
        - セグメントは Garage の presigned URL（`S3_ENDPOINT`）。同じ URL をバイト範囲で init（`EXT-X-MAP`）と本体に分ける。
          URL は「範囲の長さ + 1 時間」（上限 `VMS_PLAYBACK_URL_TTL_MAX`）で切れるので、切れたら取り直す
        - 録画ごとに `EXT-X-DISCONTINUITY`（2 件目から）と `EXT-X-PROGRAM-DATE-TIME`（録画の開始時刻）。録画のない区間は詰める
        - 先頭の録画が `from` より前に始まるときは `EXT-X-START` で `from` から再生させる
        - `from >= to`、範囲が `VMS_PLAYBACK_MAX_RANGE`（既定 24 時間）を超える、録画が 5000 件を超える場合は 400。
          カメラがない、範囲に録画がない場合は 404。オブジェクトストレージが未設定なら 503
      tags: [recordings]
      x-min-role: viewer
      parameters:
        - $ref: "#/components/parameters/PlaybackFrom"
        - $ref: "#/components/parameters/PlaybackTo"
      responses:
        "200":
          description: "プレイリスト（presigned URL を含むので `Cache-Control: no-store`）"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /cameras/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/CameraID"
    get:
      operationId: getCameraTimeline
      summary: タイムライン用の録画の目録
      description: |
        `[from, to)` の録画がある区間（隙間が 2 秒以下の録画はまとめる。範囲に切り詰める）と、
        範囲を `max_thumbnails` 個に等分して区間ごとに 1 つ選んだサムネイル（presigned URL）。
        範囲の制限とエラーはプレイリストと同じ（録画がなくても 200 で空の配列を返す）。
      tags: [recordings]
      x-min-role: viewer
      parameters:
        - $ref: "#/components/parameters/PlaybackFrom"
        - $ref: "#/components/parameters/PlaybackTo"
        - name: max_thumbnails
          in: query
          required: false
          description: 返すサムネイルの最大数（0 なら返さない）
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 48
      responses:
        "200":
          description: タイムライン
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        default:
          $ref: "#/components/responses/Error"
  /internal/mediamtx/segment-complete:
    post:
      operationId: mediamtxSegmentComplete
      summary: 録画セグメントの完了通知（MediaMTX の runOnRecordSegmentComplete）
      description: |
        MediaMTX がセグメントを書き終えたときに呼ぶ（docker/mediamtx/mtx-segment-complete.sh）。
        `segment_path` を API の録画ディレクトリに対応づけて検証し、`pending_uploads` に積む（同じファイルは 1 回だけ）。
        - `X-VMS-Hook-Token` が `VMS_HOOK_TOKEN` と一致しなければ 401。録画の取り込みが無効（トークンが未設定）なら 503
        - `segment_path` が録画ディレクトリの下の `cam_<uuid>_main/<YYYY-MM-DD_HH-MM-SS-ffffff>.mp4` でない、
          シンボリックリンクを通る、`path` と合わない場合は 400。ファイルがなければ 404。カメラが登録されていなければ 404
        - 通知を取りこぼしても、API のディレクトリ走査が拾う
      tags: [internal]
      security:
        - hookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentComplete"
      responses:
        "204":
          description: 受け付けた（すでに積まれていた場合も）
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-vms_session
      description: |
        ログインで発行するセッション Cookie（HttpOnly、Secure、SameSite=Strict）。
        状態を変えるリクエストでは、Origin（なければ Sec-Fetch-Site: same-origin）も確認する。
    hookToken:
      type: apiKey
      in: header
      name: X-VMS-Hook-Token
      description: |
        MediaMTX のフックと API の共有シークレット（`VMS_HOOK_TOKEN`）。定数時間で比較する。
        `/api/internal/*` の操作だけが使う。
  headers:
    SetSessionCookie:
      description: |
        セッション Cookie。`__Host-vms_session=<token>; Path=/; HttpOnly; Secure; SameSite=Strict`
      required: true
      schema:
        type: string
    ClearSessionCookie:
      description: |
        セッション Cookie を消す。`__Host-vms_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict`
      required: true
      schema:
        type: string
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CameraID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaybackFrom:
      name: from
      in: query
      required: true
      description: 範囲の開始（RFC 3339。`+09:00` などの `+` は `%2B` にする）
      schema:
        type: string
        format: date-time
    PlaybackTo:
      name: to
      in: query
      required: true
      description: 範囲の終わり（含まない。RFC 3339）
      schema:
        type: string
        format: date-time
  responses:
    Error:
      description: |
        エラー。すべてのエラーはこの形式で返す。
        5xx の場合、内部の詳細は含めない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      description: ASCII の英数字と `.` `_` `-`。大文字小文字を区別せずに一意
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._-]{1,64}$"
    NewPassword:
      type: string
      description: |
        Unicode のコードポイントで 12 文字以上 128 文字以下。文字種の条件はない。
      minLength: 12
      maxLength: 128
    Role:
      type: string
      description: admin は全操作、viewer は閲覧だけ
      enum: [admin, viewer]
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/NewPassword"
        role:
          $ref: "#/components/schemas/Role"
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/Role"
        password:
          $ref: "#/components/schemas/NewPassword"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          $ref: "#/components/schemas/NewPassword"
    CameraName:
      type: string
      description: 1〜100 文字。前後の空白と制御文字は不可。一意
      minLength: 1
      maxLength: 100
    RtspUrl:
      type: string
      description: |
        `rtsp://` か `rtsps://` の URL。認証情報（`user:password@`）は入れない（400）。
        空白や ASCII 以外の文字はパーセントエンコードする。
      minLength: 8
      maxLength: 2048
      pattern: "^rtsps?://"
    RetentionDays:
      type: integer
      description: 録画の保持日数
      minimum: 1
      maximum: 3650
    CameraCredentials:
      type: object
      description: RTSP の認証情報。書き込み専用（暗号化して保存し、API は返さない）
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          maxLength: 255
    CameraSummary:
      type: object
      additionalProperties: false
      required: [id, name, enabled, has_sub]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/CameraName"
        enabled:
          type: boolean
        has_sub:
          type: boolean
          description: 多分割ライブ用の sub ストリームがあるか
    CameraSummaryList:
      type: object
      additionalProperties: false
      required: [cameras]
      properties:
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraSummary"
    Camera:
      type: object
      additionalProperties: false
      required: [id, name, main_url, has_credentials, retention_days, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        has_credentials:
          type: boolean
          description: 認証情報が設定されているか（認証情報そのものは返さない）
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
          description: false なら MediaMTX から path を外す（接続も録画もしない）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CameraCreate:
      type: object
      additionalProperties: false
      required: [name, main_url]
      properties:
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        credentials:
          $ref: "#/components/schemas/CameraCredentials"
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
          description: 省略時 true
    CameraUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        remove_sub_url:
          type: boolean
          description: true なら sub の URL を消す（`sub_url` と同時には指定できない）
        credentials:
          $ref: "#/components/schemas/CameraCredentials"
        remove_credentials:
          type: boolean
          description: true なら認証情報を消す（`credentials` と同時には指定できない）
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
    SegmentComplete:
      type: object
      description: MediaMTX の MTX_PATH、MTX_SEGMENT_PATH、MTX_SEGMENT_DURATION
      additionalProperties: false
      required: [path, segment_path]
      properties:
        path:
          type: string
          description: MediaMTX の path 名（`cam_<uuid>_main`）
          minLength: 1
          maxLength: 128
        segment_path:
          type: string
          description: MediaMTX から見たセグメントの絶対パス（`/recordings/cam_<uuid>_main/...mp4`）
          minLength: 1
          maxLength: 1024
        segment_duration:
          type: string
          description: Go の duration 形式（`1m0.002s`）。記録用で、長さは ffprobe で測る
          maxLength: 64
    Timeline:
      type: object
      additionalProperties: false
      required: [from, to, intervals, thumbnails, urls_expire_at]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        intervals:
          type: array
          description: 録画がある区間（時刻順、重ならない、`[from, to)` に切り詰めたもの）
          items:
            $ref: "#/components/schemas/TimelineInterval"
        thumbnails:
          type: array
          description: サムネイル（時刻順）
          items:
            $ref: "#/components/schemas/TimelineThumbnail"
        urls_expire_at:
          type: string
          format: date-time
          description: サムネイルの URL が切れる時刻
    TimelineInterval:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    TimelineThumbnail:
      type: object
      additionalProperties: false
      required: [recording_id, time, url]
      properties:
        recording_id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
          description: サムネイルの時刻（録画の開始。先頭のキーフレーム）
        url:
          type: string
          description: JPEG の presigned URL（Garage、`S3_ENDPOINT`）
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 人が読むための説明。クライアントは code で分岐すること
    ErrorCode:
      type: string
      description: 機械が判定するためのエラーの種類
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - unsupported_media_type
        - too_many_requests
        - internal
        - service_unavailable
