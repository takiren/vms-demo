openapi: 3.0.3
info:
  title: vms-demo API
  version: 0.1.0
  description: |
    セルフホストの小規模 VMS の API。設計は docs/design.md を参照。
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api
# 既定で認証を要求する（docs/design.md の「認可」）。認証の要らない操作だけ `security: []` で外す。
# 認証が要る操作には、必要な最低ロールを `x-min-role`（admin / viewer）で必ず書く。
# viewer はログインしていれば誰でもよい。書き忘れると API が起動しない。
security:
  - cookieAuth: []
tags:
  - name: system
    description: 稼働状態など
  - name: auth
    description: ログイン、ログアウト、自分のアカウント
  - name: users
    description: ユーザー管理（admin）
  - name: cameras
    description: カメラ管理（一覧は viewer、それ以外は admin）
  - name: internal
    description: |
      MediaMTX から API への呼び出し（/api/internal/*）。Caddy が外から遮断している。
      CSRF とクッキー認証の対象外で、操作ごとに独自の認証を持つ。
  - name: live
    description: ライブ配信（MediaMTX）の閲覧
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: API プロセスの死活確認
      description: |
        プロセスが応答できるかだけを返す（liveness）。DB などの依存先は確認しない。
      tags: [system]
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: ログイン
      description: |
        ユーザー名とパスワードを検証し、新しいセッションを発行して Cookie に入れる。
        ユーザー名が存在しない場合も、パスワードが違う場合と同じ 401 を返す。
        失敗が続くと 429 を返す（ユーザー名ごと、接続元 IP ごと）。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ログインした。セッション Cookie を設定する
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          description: 失敗が多すぎる。Retry-After 秒後まで受け付けない
          headers:
            Retry-After:
              description: 再試行できるまでの秒数
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: ログアウト
      description: |
        送られてきたセッションを消し、Cookie を消す。ログインしていなくても 204 を返す。
      tags: [auth]
      security: []
      responses:
        "204":
          description: ログアウトした
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: ログイン中のユーザー
      tags: [auth]
      x-min-role: viewer
      responses:
        "200":
          description: ログイン中のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changeOwnPassword
      summary: 自分のパスワードを変える
      description: |
        現在のパスワードが必要。変更すると、自分のセッションをすべて消し、新しいセッションを発行する。
        現在のパスワードが違う場合は 400。失敗が続くと 429。
      tags: [auth]
      x-min-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 変更した。新しいセッション Cookie を設定する
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          description: 失敗が多すぎる。Retry-After 秒後まで受け付けない
          headers:
            Retry-After:
              description: 再試行できるまでの秒数
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: ユーザーの一覧
      tags: [users]
      x-min-role: admin
      responses:
        "200":
          description: ユーザー名の順（大文字小文字を区別しない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: ユーザーを作る
      description: ユーザー名が（大文字小文字を区別せずに）既にあれば 409。
      tags: [users]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: 作った
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      summary: ユーザーを取得する
      tags: [users]
      x-min-role: admin
      responses:
        "200":
          description: ユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: ユーザーのロールやパスワードを変える
      description: |
        ロールかパスワードを変えると、そのユーザーのセッションをすべて消す。
        最後の admin を降格しようとすると 409。
      tags: [users]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 変更後のユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: ユーザーを削除する
      description: 自分自身と、最後の admin は削除できない（409）。
      tags: [users]
      x-min-role: admin
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Error"
  /cameras:
    get:
      operationId: listCameras
      summary: カメラの一覧
      description: |
        ライブ表示に使う最小限の項目だけを返す（URL などの設定は返さない）。
        設定は admin が `GET /cameras/{id}` で取得する。
      tags: [cameras]
      x-min-role: viewer
      responses:
        "200":
          description: 名前の順
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSummaryList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCamera
      summary: カメラを登録する
      description: |
        URL に認証情報（`user:password@`）を入れると 400。認証情報は `credentials` で渡す（暗号化して保存し、返さない）。
        名前が既にあれば 409。登録すると MediaMTX に path を反映する。
      tags: [cameras]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraCreate"
      responses:
        "201":
          description: 登録した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/CameraID"
    get:
      operationId: getCamera
      summary: カメラの設定を取得する
      description: 認証情報は返さない（`has_credentials` だけ）。
      tags: [cameras]
      x-min-role: admin
      responses:
        "200":
          description: カメラ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCamera
      summary: カメラの設定を変える
      description: |
        指定した項目だけを変える。認証情報は、`credentials` で置き換えるか `remove_credentials: true` で消す。
        どちらもなければ今のものを残す。sub の URL は `remove_sub_url: true` で消す。
      tags: [cameras]
      x-min-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraUpdate"
      responses:
        "200":
          description: 変更後のカメラ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCamera
      summary: カメラを削除する
      description: |
        録画が残っているカメラは削除できない（409）。録画を止めるだけなら `enabled: false` にする。
      tags: [cameras]
      x-min-role: admin
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Error"
  /internal/mediamtx/segment-complete:
    post:
      operationId: mediamtxSegmentComplete
      summary: 録画セグメントの完了通知（MediaMTX の runOnRecordSegmentComplete）
      description: |
        MediaMTX がセグメントを書き終えたときに呼ぶ（docker/mediamtx/mtx-segment-complete.sh）。
        `segment_path` を API の録画ディレクトリに対応づけて検証し、`pending_uploads` に積む（同じファイルは 1 回だけ）。
        - `X-VMS-Hook-Token` が `VMS_HOOK_TOKEN` と一致しなければ 401。録画の取り込みが無効（トークンが未設定）なら 503
        - `segment_path` が録画ディレクトリの下の `cam_<uuid>_main/<YYYY-MM-DD_HH-MM-SS-ffffff>.mp4` でない、
          シンボリックリンクを通る、`path` と合わない場合は 400。ファイルがなければ 404。カメラが登録されていなければ 404
        - 通知を取りこぼしても、API のディレクトリ走査が拾う
      tags: [internal]
      security:
        - hookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentComplete"
      responses:
        "204":
          description: 受け付けた（すでに積まれていた場合も）
  /live/token:
    post:
      operationId: issueLiveToken
      summary: ライブ用のトークンを発行する
      description: |
        MediaMTX（`/live/webrtc/`、`/live/hls/`）で配信を見るための短命のトークン（5 分）。
        ブラウザのセッション Cookie は MediaMTX から API に渡らないので、代わりにこれを
        `Authorization: Bearer <token>`（reader.js の `token`、hls.js の `xhrSetup`）か、
        HLS の `?token=<token>` で MediaMTX に渡す。
        トークンはこのセッションに結び付く。ログアウトなどでセッションが消えると使えなくなる。
        期限が切れる前に取り直すこと（docs/design.md の「ライブ用トークン」）。
      tags: [live]
      x-min-role: viewer
      responses:
        "200":
          description: 発行した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveToken"
        default:
          $ref: "#/components/responses/Error"
  /internal/mediamtx/auth:
    post:
      operationId: mediamtxAuth
      summary: MediaMTX の認証の問い合わせ（authMethod は http）
      description: |
        MediaMTX がすべての操作をここに問い合わせる。2xx なら許可、それ以外なら拒否。既定で拒否する。
        - `api`: `VMS_MEDIAMTX_API_USER` / `VMS_MEDIAMTX_API_PASSWORD` の組だけ許可
        - `read`: WebRTC / HLS で、有効なライブ用トークン（`token` か `query` の `token`）があり、
          path が有効なカメラのものなら許可。Basic 認証（`user` / `password`）では許可しない
        - `publish`、`playback`、`metrics`、`pprof`: 拒否
        MediaMTX は Basic 認証（ユーザー `mediamtx`、パスワード `VMS_MEDIAMTX_AUTH_SECRET`）で名乗る。
        違えば 401、失敗が多すぎれば 429。Caddy は `/api/internal/` を外から遮断する。
      tags: [internal]
      security:
        - mediamtxAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaMTXAuthRequest"
      responses:
        "200":
          description: 許可する
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaMTXAuthResult"
        "403":
          description: 拒否する
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-vms_session
      description: |
        ログインで発行するセッション Cookie（HttpOnly、Secure、SameSite=Strict）。
        状態を変えるリクエストでは、Origin（なければ Sec-Fetch-Site: same-origin）も確認する。
    hookToken:
      type: apiKey
      in: header
      name: X-VMS-Hook-Token
      description: |
        MediaMTX のフックと API の共有シークレット（`VMS_HOOK_TOKEN`）。定数時間で比較する。
        `/api/internal/*` の操作だけが使う。
    mediamtxAuth:
      type: http
      scheme: basic
      description: |
        MediaMTX から API への呼び出し（`/internal/` の操作だけ）。ユーザーは `mediamtx`、
        パスワードは `VMS_MEDIAMTX_AUTH_SECRET`。MediaMTX の `authHTTPAddress` の userinfo に入れる。
  headers:
    SetSessionCookie:
      description: |
        セッション Cookie。`__Host-vms_session=<token>; Path=/; HttpOnly; Secure; SameSite=Strict`
      required: true
      schema:
        type: string
    ClearSessionCookie:
      description: |
        セッション Cookie を消す。`__Host-vms_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict`
      required: true
      schema:
        type: string
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CameraID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: |
        エラー。すべてのエラーはこの形式で返す。
        5xx の場合、内部の詳細は含めない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Username:
      type: string
      description: ASCII の英数字と `.` `_` `-`。大文字小文字を区別せずに一意
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9._-]{1,64}$"
    NewPassword:
      type: string
      description: |
        Unicode のコードポイントで 12 文字以上 128 文字以下。文字種の条件はない。
      minLength: 12
      maxLength: 128
    Role:
      type: string
      description: admin は全操作、viewer は閲覧だけ
      enum: [admin, viewer]
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/NewPassword"
        role:
          $ref: "#/components/schemas/Role"
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/Role"
        password:
          $ref: "#/components/schemas/NewPassword"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          $ref: "#/components/schemas/NewPassword"
    CameraName:
      type: string
      description: 1〜100 文字。前後の空白と制御文字は不可。一意
      minLength: 1
      maxLength: 100
    RtspUrl:
      type: string
      description: |
        `rtsp://` か `rtsps://` の URL。認証情報（`user:password@`）は入れない（400）。
        空白や ASCII 以外の文字はパーセントエンコードする。
      minLength: 8
      maxLength: 2048
      pattern: "^rtsps?://"
    RetentionDays:
      type: integer
      description: 録画の保持日数
      minimum: 1
      maximum: 3650
    CameraCredentials:
      type: object
      description: RTSP の認証情報。書き込み専用（暗号化して保存し、API は返さない）
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          maxLength: 255
    CameraSummary:
      type: object
      additionalProperties: false
      required: [id, name, enabled, has_sub]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/CameraName"
        enabled:
          type: boolean
        has_sub:
          type: boolean
          description: 多分割ライブ用の sub ストリームがあるか
    CameraSummaryList:
      type: object
      additionalProperties: false
      required: [cameras]
      properties:
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/CameraSummary"
    Camera:
      type: object
      additionalProperties: false
      required: [id, name, main_url, has_credentials, retention_days, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        has_credentials:
          type: boolean
          description: 認証情報が設定されているか（認証情報そのものは返さない）
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
          description: false なら MediaMTX から path を外す（接続も録画もしない）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CameraCreate:
      type: object
      additionalProperties: false
      required: [name, main_url]
      properties:
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        credentials:
          $ref: "#/components/schemas/CameraCredentials"
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
          description: 省略時 true
    CameraUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/CameraName"
        main_url:
          $ref: "#/components/schemas/RtspUrl"
        sub_url:
          $ref: "#/components/schemas/RtspUrl"
        remove_sub_url:
          type: boolean
          description: true なら sub の URL を消す（`sub_url` と同時には指定できない）
        credentials:
          $ref: "#/components/schemas/CameraCredentials"
        remove_credentials:
          type: boolean
          description: true なら認証情報を消す（`credentials` と同時には指定できない）
        retention_days:
          $ref: "#/components/schemas/RetentionDays"
        enabled:
          type: boolean
    SegmentComplete:
      type: object
      description: MediaMTX の MTX_PATH、MTX_SEGMENT_PATH、MTX_SEGMENT_DURATION
      additionalProperties: false
      required: [path, segment_path]
      properties:
        path:
          type: string
          description: MediaMTX の path 名（`cam_<uuid>_main`）
          minLength: 1
          maxLength: 128
        segment_path:
          type: string
          description: MediaMTX から見たセグメントの絶対パス（`/recordings/cam_<uuid>_main/...mp4`）
          minLength: 1
          maxLength: 1024
        segment_duration:
          type: string
          description: Go の duration 形式（`1m0.002s`）。記録用で、長さは ffprobe で測る
          maxLength: 64
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 人が読むための説明。クライアントは code で分岐すること
    ErrorCode:
      type: string
      description: 機械が判定するためのエラーの種類
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - payload_too_large
        - unsupported_media_type
        - too_many_requests
        - internal
        - service_unavailable
    LiveToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: |
            base64url（パディングなし）の不透明な文字列。中身を解釈しないこと。
            URL のクエリにそのまま入れられる（`:` を含まない）
        expires_at:
          type: string
          format: date-time
          description: これより後は使えない。その前に取り直す
    MediaMTXAuthRequest:
      type: object
      description: |
        MediaMTX（v1.21）が送る本文。知らない項目は無視する（MediaMTX の更新で増えることがある）。
        `password` と `token` には秘密が入るので、ログに出さない。`query` にもトークンが入りうる。
      required: [action]
      properties:
        ip:
          type: string
          description: MediaMTX に接続してきたクライアントの IP
        user:
          type: string
        password:
          type: string
        token:
          type: string
          description: |
            `Authorization: Bearer` のトークン。Bearer がなければ MediaMTX は Basic のパスワードを入れる
        action:
          type: string
          description: publish / read / playback / api / metrics / pprof（知らない値は拒否）
        path:
          type: string
        protocol:
          type: string
          description: rtsp / rtmp / hls / webrtc / srt / moq。api などでは空
        id:
          type: string
          nullable: true
          description: MediaMTX のセッションの ID。ないときは null
        query:
          type: string
          description: 生のクエリ文字列（`?` なし）
        userAgent:
          type: string
    MediaMTXAuthResult:
      type: object
      additionalProperties: false
      properties:
        expireAt:
          type: string
          format: date-time
          description: MediaMTX はこの時刻に配信を切る（read のとき）
