name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - "api/**"
      # 録画取り込みの結合テストが LGPL の ffmpeg（イメージ）と testdata を使う
      - "docker/ffmpeg/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "api/**"
      # 録画取り込みの結合テストが LGPL の ffmpeg（イメージ）と testdata を使う
      - "docker/ffmpeg/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # oapi-codegen と sqlc（internal/db）の生成物。sqlc は go run でバージョンを固定して動かす（cgo を使う）
      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- . ../api
          untracked="$(git status --porcelain -- . ../api)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::generated files are not committed; run 'make generate'"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 録画取り込みのテストは本番と同じ LGPL の ffmpeg を使う。images.yml と同じキャッシュ（scope=ffmpeg）でビルドし、
      # /opt/ffmpeg をそのまま取り出す（RUNPATH が /opt/ffmpeg/lib なので同じパスに置く。ランナーは Ubuntu 24.04 = glibc 2.39）
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build ffmpeg image
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker/ffmpeg
          tags: vms-ffmpeg:ci
          load: true
          push: false
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
      - name: Install ffmpeg from the image
        run: |
          id="$(docker create vms-ffmpeg:ci)"
          sudo docker cp "$id:/opt/ffmpeg" /opt/ffmpeg
          docker rm "$id"
          /opt/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
          /opt/ffmpeg/bin/ffprobe -hide_banner -version | head -n 1

      # testcontainers で PostgreSQL と Garage を起動する結合テストを含む（ubuntu-latest には Docker がある）
      - name: Test
        env:
          VMS_TEST_FFMPEG_DIR: /opt/ffmpeg/bin
          VMS_TEST_REQUIRE_FFMPEG: "1"
        run: make test

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '### Go coverage (generated code excluded)'
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-coverage
          path: server/coverage.out
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # server/Makefile の GOLANGCI_LINT_VERSION と揃える（Go 1.27 でビルドされた版が必要）
          version: v2.15.0
          working-directory: server
