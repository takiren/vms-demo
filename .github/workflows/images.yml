name: Images

on:
  pull_request:
    paths:
      - docker/**
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/images.yml

permissions:
  contents: read

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build ffmpeg image
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker/ffmpeg
          tags: vms-ffmpeg:ci
          load: true
          push: false
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
      - name: Verify (license, components, smoke test)
        run: docker run --rm --entrypoint /opt/ffmpeg-test/verify.sh vms-ffmpeg:ci
      - name: Verify COPY --from into another image
        run: |
          printf 'FROM vms-ffmpeg:ci AS ffmpeg\nFROM ubuntu:24.04\nCOPY --from=ffmpeg /opt/ffmpeg /opt/ffmpeg\nRUN /opt/ffmpeg/bin/ffmpeg -hide_banner -version\n' \
            | docker buildx build --builder default -
